<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="An interactive atlas of CSCE 4201 Theory of Computing: run the machines, play the proofs.">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Automata Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>

/* Layout: a "stage" — the machine (tape + diagram) on the left, the stack tower in the middle,
   the written trace on the right; below it the multiverse of branches and the stack skyline,
   both sharing one time axis (move number). Cool paper + ink, amber marks "now". */
:root{
  --paper:#f3f5fa; --surface:#ffffff; --surface-2:#f7f8fc; --ink:#141b33; --muted:#5b6482; --faint:#a3aac2; --line:#dde2ee;
  --now:#e2961c; --now-soft:#fdf0d8; --accept:#139169; --accept-soft:#dcf3ea; --reject:#cf3f55; --reject-soft:#fbe3e7;
  --sym-X:#6a55e0; --sym-Z:#56607e; --sym-A:#2c78dc; --sym-B:#e06b23; --sym-P:#139169; --sym-N:#cf3f55;
  --sym-1:#0e8fa6; --sym-2:#b14fc4; --sym-3:#8a6d16; --sym-4:#3a8f2f;
  --plate-ink:#ffffff;
  --display:"Bricolage Grotesque", "Space Grotesk", system-ui, sans-serif;
  --body:"Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Consolas, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0d1222; --surface:#151c31; --surface-2:#1a2239; --ink:#e7ebf7; --muted:#9aa3c0; --faint:#5d6688; --line:#29324e;
  --now:#f3ac3c; --now-soft:#3a2d14; --accept:#2fc392; --accept-soft:#11352a; --reject:#ef6177; --reject-soft:#3b1a22;
  --sym-X:#8a78ff; --sym-Z:#6d7799; --sym-A:#4a92f0; --sym-B:#f0843d; --sym-P:#22a87c; --sym-N:#e2546b;
  --sym-1:#22a9c0; --sym-2:#c46ad6; --sym-3:#b0912e; --sym-4:#4fae43;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#0d1222; --surface:#151c31; --surface-2:#1a2239; --ink:#e7ebf7; --muted:#9aa3c0; --faint:#5d6688; --line:#29324e;
  --now:#f3ac3c; --now-soft:#3a2d14; --accept:#2fc392; --accept-soft:#11352a; --reject:#ef6177; --reject-soft:#3b1a22;
  --sym-X:#8a78ff; --sym-Z:#6d7799; --sym-A:#4a92f0; --sym-B:#f0843d; --sym-P:#22a87c; --sym-N:#e2546b;
  --sym-1:#22a9c0; --sym-2:#c46ad6; --sym-3:#b0912e; --sym-4:#4fae43;
  color-scheme:dark; }

*{box-sizing:border-box}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.5;margin:0}
.app{max-width:1500px;margin:0 auto;padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--now);outline-offset:2px}
.mono{font-family:var(--mono)}

/* header */
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.eyebrow{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{font-family:var(--display);font-weight:800;font-size:clamp(30px,4.2vw,46px);line-height:1;margin:4px 0 6px;letter-spacing:-.02em;text-wrap:balance}
h1 .stk{display:inline-flex;flex-direction:column;vertical-align:-0.08em;gap:2px;margin-left:.18em}
h1 .stk i{display:block;width:.55em;height:.16em;border-radius:3px;background:var(--sym-X)}
h1 .stk i:nth-child(2){background:var(--sym-X);opacity:.75}
h1 .stk i:last-child{background:repeating-linear-gradient(135deg,var(--sym-Z) 0 3px,transparent 3px 6px),var(--surface);border:1px solid var(--sym-Z)}
.sub{margin:0;color:var(--muted);max-width:68ch}
.head-actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:8px;transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn svg{width:16px;height:16px}

/* machine tabs */
.machines{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.tab b{font-family:var(--mono);font-weight:700}
.tab span{color:var(--muted);font-size:12px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tab[aria-selected="true"] span{color:inherit;opacity:.75}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.ph h2{font-family:var(--display);font-size:16px;font-weight:700;margin:0;letter-spacing:-.01em}
.ph .hint{font-size:12px;color:var(--muted)}

/* machine card */
.mcard{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px}
.lang{font-family:var(--mono);font-size:20px;font-weight:700}
.idea{margin:4px 0 10px;color:var(--muted);max-width:62ch}
.tuple{font-family:var(--mono);font-size:13px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:8px 10px;overflow-x:auto;white-space:nowrap}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.chip{font-size:12px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid var(--line);background:var(--surface-2)}
.chip.good{background:var(--accept-soft);color:var(--accept);border-color:transparent}
.chip.bad{background:var(--reject-soft);color:var(--reject);border-color:transparent}
.chip.mode{background:var(--now-soft);color:var(--ink);border-color:transparent}
.delta{list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:13px;display:grid;gap:2px}
.delta li{padding:3px 8px;border-radius:7px;display:flex;gap:10px;justify-content:space-between;transition:background .2s}
.delta li em{font-style:normal;color:var(--muted);font-family:var(--body);font-size:12px;text-align:right}
.delta li.on{background:var(--now-soft);box-shadow:inset 3px 0 0 var(--now)}
.dlabel{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:4px}

/* editor */
.editor{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
.editor textarea{width:100%;min-height:230px;resize:vertical;font-family:var(--mono);font-size:13px;line-height:1.55;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.editor .help{color:var(--muted);font-size:13px}
.editor .help code{font-family:var(--mono);font-size:12.5px;background:var(--surface-2);padding:1px 5px;border-radius:5px;border:1px solid var(--line)}
.errors{color:var(--reject);font-family:var(--mono);font-size:12.5px;white-space:pre-wrap;margin:8px 0 0}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center}
.inputbox{display:flex;align-items:center;gap:8px}
.inputbox label{font-weight:600;font-size:13px}
.inputbox input{font-family:var(--mono);font-size:16px;width:12ch;padding:7px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.examples{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.examples .lbl{font-size:12px;color:var(--muted)}
.ex{font-family:var(--mono);font-size:13px;border:1px dashed var(--line);border-radius:8px;background:transparent;padding:3px 8px;cursor:pointer}
.ex:hover{border-color:var(--faint)}
.ex small{font-family:var(--body);margin-left:4px}
.ex .y{color:var(--accept)} .ex .n{color:var(--reject)}
.transport{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-left:auto}
.ibtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer}
.ibtn svg{width:18px;height:18px}
.ibtn.play{width:48px;background:var(--now);border-color:var(--now);color:#1b1404}
.ibtn:disabled{opacity:.4;cursor:default}
.speed{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.speed input{width:90px;accent-color:var(--now)}
.counter{font-family:var(--mono);font-size:13px;color:var(--muted);min-width:9ch;text-align:right}

/* stage */
.stage{display:grid;grid-template-columns:minmax(0,1.55fr) 210px minmax(0,1fr);gap:14px;align-items:stretch}
.run{display:flex;flex-direction:column;gap:10px;position:relative;overflow:hidden}
.tape{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;padding:6px 0 18px;position:relative}
.cell{width:40px;height:44px;border:1.5px solid var(--line);border-radius:8px;display:grid;place-items:center;font-family:var(--mono);font-size:20px;font-weight:700;background:var(--surface-2);position:relative;transition:all .25s}
.cell.read{color:var(--faint);background:transparent;border-style:dashed}
.cell.head{border-color:var(--now);background:var(--now-soft);transform:translateY(-3px)}
.cell.head::after{content:"";position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-bottom-color:var(--now)}
.cell.end{border-style:dotted;color:var(--faint);font-size:13px;font-weight:600}
.diagram{width:100%;overflow-x:auto}
.diagram svg{display:block;margin:0 auto;max-width:100%;height:auto}
.st-circle{fill:var(--surface);stroke:var(--ink);stroke-width:2;transition:fill .25s,stroke .25s}
.st.cur .st-circle{fill:var(--now);stroke:var(--now)}
.st.cur .st-ring{stroke:var(--now)}
.st-ring{fill:none;stroke:var(--ink);stroke-width:2}
.st-text{font-family:var(--mono);font-size:17px;font-weight:700;fill:var(--ink)}
.st.cur .st-text{fill:#1b1404}
.st.done-acc .st-circle{fill:var(--accept);stroke:var(--accept)} .st.done-acc .st-text{fill:#fff} .st.done-acc .st-ring{stroke:var(--accept)}
.st.done-rej .st-circle{fill:var(--reject);stroke:var(--reject)} .st.done-rej .st-text{fill:#fff}
.halo{fill:none;stroke:var(--now);stroke-width:2;opacity:0}
.st.cur .halo{animation:halo 1.6s ease-out infinite}
@keyframes halo{0%{opacity:.7;r:31px}100%{opacity:0;r:50px}}
.edge{fill:none;stroke:var(--faint);stroke-width:1.8;transition:stroke .2s,stroke-width .2s}
.edge.on{stroke:var(--now);stroke-width:3.2}
.elabel{font-family:var(--mono);font-size:13.5px;fill:var(--muted)}
.elabel.on{fill:var(--ink);font-weight:700}
.elabel-bg{fill:var(--now-soft);opacity:0}
.elabel-bg.on{opacity:1}
.startlbl{font-family:var(--body);font-size:12px;fill:var(--muted)}
.token{fill:var(--now);stroke:var(--surface);stroke-width:2}
.narr{border-top:1px solid var(--line);padding-top:10px;min-height:66px;display:flex;gap:12px;align-items:flex-start}
.narr .step{font-family:var(--mono);font-size:12px;font-weight:700;background:var(--ink);color:var(--paper);border-radius:6px;padding:2px 7px;white-space:nowrap}
.narr p{margin:0;font-size:15px;text-wrap:pretty}
.narr p b{font-family:var(--mono)}
.narr .why{color:var(--muted);display:block;font-size:13.5px;margin-top:2px}
.stamp{position:absolute;right:18px;top:58px;font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:.06em;padding:4px 14px;border:3px solid currentColor;border-radius:10px;transform:rotate(-6deg) scale(1);opacity:1;pointer-events:none;background:var(--surface)}
.stamp.acc{color:var(--accept)} .stamp.rej{color:var(--reject)}
.stamp.pop{animation:stamp .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:rotate(-6deg) scale(2.2);opacity:0}100%{transform:rotate(-6deg) scale(1);opacity:1}}

/* stack */
.stackp{display:flex;flex-direction:column}
.tower-wrap{flex:1;display:flex;gap:6px;min-height:300px}
.tower{flex:1;position:relative;border:2px solid var(--line);border-top:none;border-radius:0 0 12px 12px;display:flex;flex-direction:column-reverse;align-items:center;gap:4px;padding:6px 6px 8px;background:linear-gradient(to top,var(--surface-2),transparent)}
.plate{width:100%;max-width:120px;height:var(--ph,30px);border-radius:7px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:min(17px,calc(var(--ph,30px) * .6));color:var(--plate-ink);flex:0 0 auto;box-shadow:0 2px 0 rgba(0,0,0,.18)}
.plate.bottom{background:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 4px,transparent 4px 9px),var(--c)}
.plate.in{animation:drop .38s cubic-bezier(.2,1.3,.4,1)}
@keyframes drop{0%{transform:translateY(-60px);opacity:0}100%{transform:none;opacity:1}}
.plate.out{position:absolute;animation:lift .4s ease-in forwards}
@keyframes lift{to{transform:translateY(-70px) rotate(8deg);opacity:0}}
.topmark{position:absolute;left:-2px;font-size:11px;font-weight:700;color:var(--now);transform:translate(-100%,-50%);white-space:nowrap;transition:top .3s}
.tower-empty{position:absolute;inset:auto 0 12px;text-align:center;color:var(--muted);font-size:12px;font-weight:600}
.written{margin-top:10px;font-size:12px;color:var(--muted)}
.written code{display:block;font-family:var(--mono);font-size:16px;color:var(--ink);margin-top:2px;word-break:break-all}
.written code i{font-style:normal;color:var(--now);text-decoration:underline;text-underline-offset:3px}

/* trace */
.tracep{display:flex;flex-direction:column}
.trace{font-family:var(--mono);font-size:13px;overflow:auto;max-height:420px;flex:1;scroll-behavior:smooth;padding-right:4px}
.idr{display:grid;grid-template-columns:16px auto;column-gap:6px;padding:3px 6px;border-radius:7px;white-space:pre}
.idr .tu{color:var(--muted)}
.idr .why{grid-column:2;font-size:11.5px;color:var(--muted)}
.idr.cur{background:var(--now-soft)}
.idr.blank{color:var(--faint)}
.idr.verdict{display:block;font-family:var(--display);font-weight:700;font-size:14px;white-space:normal;margin-top:4px}
.idr.verdict.acc{color:var(--accept)} .idr.verdict.rej{color:var(--reject)}

/* lower */
.lower{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px}
.tree-wrap,.sky-wrap{overflow:auto;max-height:360px;min-height:200px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line)}
.tree-wrap svg,.sky-wrap svg{display:block}
.tnode circle{fill:var(--surface);stroke:var(--faint);stroke-width:1.5;cursor:pointer}
.tnode text{font-family:var(--mono);font-size:11px;fill:var(--muted);pointer-events:none;font-weight:700}
.tnode.path circle{stroke:var(--now);stroke-width:2.5}
.tnode.cur circle{fill:var(--now);stroke:var(--now)}
.tnode.cur text{fill:#1b1404}
.tnode.acc circle{fill:var(--accept);stroke:var(--accept)} .tnode.acc text{fill:#fff}
.tnode.dead circle{stroke:var(--reject);stroke-dasharray:2 2}
.tnode.hide{opacity:0;pointer-events:none}
.tedge{fill:none;stroke:var(--faint);stroke-width:1.4}
.tedge.path{stroke:var(--now);stroke-width:2.6}
.tedge.hide{opacity:0}
.tedge.fate-dead{stroke-dasharray:3 3}
.tmark{font-family:var(--body);font-size:13px;font-weight:800}
.tmark.acc{fill:var(--accept)} .tmark.rej{fill:var(--reject)}
.tlabel{font-family:var(--mono);font-size:11px;font-weight:700;fill:var(--muted)}
.tnode, .tedge{transition:opacity .3s}
.mvstats{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.mvstats b{color:var(--ink);font-family:var(--mono)}
.sky-block{stroke:var(--surface);stroke-width:1}
.sky-col.future{opacity:.13}
.sky-axis{font-family:var(--mono);font-size:11.5px;fill:var(--muted)}
.sky-cur{fill:none;stroke:var(--now);stroke-width:2;rx:5}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}

footer{color:var(--muted);font-size:12.5px;display:flex;gap:16px;flex-wrap:wrap;justify-content:space-between}
footer kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:0 5px;background:var(--surface)}

/* presenter mode */
:root.present .app{max-width:none}
:root.present .mcard .idea, :root.present footer{display:none}

@media (max-width:1150px){
  .stage{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .run{grid-column:1 / -1}
  .lower,.mcard,.editor{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .transport{margin-left:0}
  .cell{width:32px;height:38px;font-size:17px}
  .tower-wrap{min-height:240px}
  .stamp{font-size:18px;top:8px;right:8px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

/* ---- Automata Atlas: site shell (tokens come from theatre.css) ---- */
.site{max-width:1500px;margin:0 auto;padding-block:0 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.01em;color:var(--ink);text-decoration:none;cursor:pointer;background:none;border:0;padding:0}
.logo .mark{display:inline-flex;flex-direction:column;gap:2px}
.logo .mark i{display:block;width:18px;height:5px;border-radius:2px;background:var(--sym-X)}
.logo .mark i:nth-child(2){background:var(--sym-A)} .logo .mark i:nth-child(3){background:var(--now)}
.bar-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pass-pill{font-size:12.5px;font-weight:600;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--surface);display:inline-flex;gap:8px;align-items:center}
.pass-pill b{font-family:var(--mono)}
.meter{width:70px;height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accept);border-radius:9px;transition:width .4s}
a{color:inherit}
.view{display:flex;flex-direction:column;gap:16px}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:24px;align-items:end;padding:10px 0 4px}
.hero h1{font-size:clamp(34px,5vw,60px)}
.hero .lede{font-size:16px;color:var(--muted);max-width:60ch;margin:8px 0 0}
.facts{display:grid;gap:8px;margin:0;padding:0;list-style:none}
.facts li{border-left:3px solid var(--now);padding:2px 0 2px 12px;font-size:13.5px;color:var(--muted)}
.facts li b{color:var(--ink);display:block;font-family:var(--display);font-size:15px}
.mapwrap{overflow-x:auto}
.mapwrap svg{display:block;width:100%;min-width:760px;height:auto}
.region{stroke-width:1.5;rx:26}
.r0{fill:var(--surface);stroke:var(--line)}
.r1{fill:var(--surface-2);stroke:var(--line)}
.r2{fill:color-mix(in srgb,var(--sym-A) 9%,var(--surface));stroke:color-mix(in srgb,var(--sym-A) 45%,var(--line))}
.r3{fill:color-mix(in srgb,var(--now) 14%,var(--surface));stroke:color-mix(in srgb,var(--now) 60%,var(--line))}
.rlabel{font-family:var(--display);font-weight:700;font-size:15px;fill:var(--ink)}
.rsub{font-family:var(--body);font-size:11.5px;fill:var(--muted)}
.rland{font-family:var(--mono);font-size:11.5px;fill:var(--muted)}
.route{fill:none;stroke:var(--faint);opacity:.6;stroke-width:2;stroke-dasharray:2 7;stroke-linecap:round}
.stop{cursor:pointer}

/* station shell */
.crumb{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--muted)}

.prose{max-width:72ch;color:var(--ink);font-size:15px}

.prose code,.kbd{font-family:var(--mono);font-size:13.5px;background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}

.recipe{counter-reset:r;list-style:none;margin:0;padding:0;display:grid;gap:8px}
.recipe li{counter-increment:r;display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}

.nextprev{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
.note{border-left:3px solid var(--now);background:var(--now-soft);padding:8px 12px;border-radius:0 10px 10px 0;font-size:13.5px}
.note.bad{border-color:var(--reject);background:var(--reject-soft)}
.note.good{border-color:var(--accept);background:var(--accept-soft)}
select,.txt{font-family:var(--mono);font-size:14px;padding:6px 8px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

table.dt{border-collapse:collapse;font-family:var(--mono);font-size:13.5px}

/* adversary game */
.game{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:14px;align-items:start}

.move .who{font-size:11.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 0;text-align:center;border-radius:8px}
.move.adv .who{background:var(--reject-soft);color:var(--reject)}
.move.you .who{background:var(--accept-soft);color:var(--accept)}
.move.sys .who{background:var(--surface-2);color:var(--muted)}
.move .body{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0}
.move.in{animation:drop .35s ease-out}
.move .body p{margin:0 0 6px} .move .body p:last-child{margin:0}
.opts{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

.opt:hover{border-color:var(--now)}
.opt:disabled{opacity:.5;cursor:default}
.opt.sel{border-color:var(--now);background:var(--now-soft);opacity:1}
.wstr{font-family:var(--mono);font-size:19px;font-weight:700;display:flex;flex-wrap:wrap;gap:2px;margin:6px 0;align-items:flex-end}

.wstr .y{background:var(--now-soft);border-color:var(--now)}
.wstr .y2{background:var(--now);border-color:var(--now);color:#1b1404}
.wstr .z{background:color-mix(in srgb,var(--sym-X) 15%,var(--surface));border-color:var(--sym-X)}
.wstr .gap{min-width:8px;border:0;background:none}
.wstr.pick span{cursor:pointer}
.keyline{display:flex;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.keyline i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.board{position:sticky;top:60px;display:flex;flex-direction:column;gap:10px}
.order{font-family:var(--mono);font-size:13.5px;display:grid;gap:4px}
.order div{padding:5px 9px;border-radius:8px;border:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
.order div.on{border-color:var(--now);background:var(--now-soft);font-weight:700}
.order div.done{color:var(--muted)}
.big{font-family:var(--display);font-weight:800;font-size:22px}
.big.win{color:var(--accept)} .big.lose{color:var(--reject)}

@media (max-width:1000px){ .hero,.two,.three,.game{grid-template-columns:minmax(0,1fr)} .board{position:static} }
@media (max-width:560px){ .move{grid-template-columns:minmax(0,1fr)} .move .who{justify-self:start;padding:3px 10px} }
.view > *, .blk > *{min-width:0;max-width:100%}

<div class="site">

    <button class="logo" type="button" id="logoBtn" aria-label="Automata Atlas, home"><span class="mark" aria-hidden="true"><i></i><i></i><i></i></span>Automata Atlas</button>
    <div class="bar-right"><span class="pass-pill" id="passPill"></span></div>
  </div>

</div>
<div class="toast" id="toast" role="status"></div>

<script>
/* Automata Atlas core: registry, router, passport (progress), shared widgets */
"use strict";
const SVGNS = "http://www.w3.org/2000/svg";
const EPS = "ε";
function svg(tag, attrs, parent, text){ const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(text!=null) e.textContent=text; if(parent) parent.appendChild(e); return e; }

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }
const reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const Atlas = {
  stations: {}, order: [], cleanups: [],
  register(def){ this.stations[def.id]=def; this.order.push(def.id); },
  /* ---- passport ---- */
  _load(){ try{ return JSON.parse(localStorage.getItem("atlas.passport")||"{}"); }catch(e){ return {}; } },
  _mem: null,
  passport(){ if(!this._mem) this._mem=this._load(); return this._mem; },
  has(st, id){ const p=this.passport(); return !!(p[st] && p[st][id]); },
  stamp(st, id){
    if(this.has(st,id)) return false;
    const p=this.passport(); (p[st]=p[st]||{})[id]=1;
    try{ localStorage.setItem("atlas.passport", JSON.stringify(p)); }catch(e){}
    const def=this.stations[st]; const s=def && def.stamps.find(x=>x.id===id);
    if(s) this.toast("Passport stamp: "+s.label); this.refreshBar();
    document.querySelectorAll(`.stp[data-st="${st}"][data-id="${id}"]`).forEach(e=>e.classList.add("on"));
    return true;
  },
  count(st){ const def=this.stations[st]; if(!def||!def.stamps) return [0,0]; return [def.stamps.filter(s=>this.has(st,s.id)).length, def.stamps.length]; },
  totals(){ let a=0,b=0; this.order.forEach(id=>{ const [x,y]=this.count(id); a+=x; b+=y; }); return [a,b]; },
  toast(msg){ const t=document.getElementById("toast"); if(!t) return; t.textContent=msg; t.classList.add("show"); clearTimeout(this._tt); this._tt=setTimeout(()=>t.classList.remove("show"),2600); },
  refreshBar(){ const [a,b]=this.totals(); const pill=document.getElementById("passPill"); if(pill) pill.innerHTML=`Passport <b>${a}/${b}</b><span class="meter"><i style="width:${b?100*a/b:0}%"></i></span>`; },
  stampRow(st){ const def=this.stations[st]; const row=h("div","stamps"); def.stamps.forEach(s=>{ const e=h("span","stp"+(this.has(st,s.id)?" on":""),"◉ "+esc(s.label)); e.dataset.st=st; e.dataset.id=s.id; row.appendChild(e); }); return row; },
  /* ---- router ---- */
  go(id){ if(location.hash.slice(1)===id) this.route(); else location.hash=id; },
  onCleanup(fn){ this.cleanups.push(fn); },
  route(){
    this.cleanups.splice(0).forEach(fn=>{ try{ fn(); }catch(e){} });
    const id=location.hash.slice(1); const view=document.getElementById("view"); view.innerHTML="";
    const def=this.stations[id];
    if(def && def.mount){ this.mountStation(def, view); } else { Home.mount(view); }
    window.scrollTo(0,0); this.refreshBar();
  },
  mountStation(def, view){
    const built=this.order.filter(i=>this.stations[i].mount); const k=built.indexOf(def.id);
    const crumb=h("div","crumb"); const back=h("button",null,"← Atlas"); back.type="button"; back.onclick=()=>this.go("home"); crumb.appendChild(back);
    crumb.appendChild(h("span",null,"· "+esc(def.region)+" · "+esc(def.sessions)));
    view.appendChild(crumb);
    const head=h("header","st-head",`<div class="eyebrow">${esc(def.module)}</div><h1>${esc(def.title)}</h1><p class="sub">${esc(def.blurb)}</p>`);
    view.appendChild(head); view.appendChild(this.stampRow(def.id));
    const body=h("div","view"); view.appendChild(body);
    def.mount(body);
    const np=h("div","nextprev");
    const mk=(i,lbl)=>{ const b=h("button","btn",lbl); b.type="button"; b.onclick=()=>this.go(i); return b; };
    np.appendChild(k>0 ? mk(built[k-1],"← "+esc(this.stations[built[k-1]].title)) : mk("home","← Atlas"));
    np.appendChild(k<built.length-1 ? mk(built[k+1],esc(this.stations[built[k+1]].title)+" →") : mk("home","Back to the atlas →"));
    view.appendChild(np);
  }
};

/* ---- section helper: a titled block ---- */
function block(parent, kicker, title, id){ const b=h("section","blk"); if(id) b.id="blk-"+id; b.appendChild(h("div","kicker",esc(kicker))); b.appendChild(h("h2",null,esc(title))); parent.appendChild(b); return b; }

/* ---- quick-fire: "A student claims ..." (her midterm format) ---- */
function quickFire(parent, items, onAll){
  const grid=h("div","qf"); parent.appendChild(grid); let answered=0, correct=0;
  items.forEach(it=>{
    const c=h("div","qf-card"); c.appendChild(h("div","who","A student claims"));
    c.appendChild(h("p","claim",it.claim));
    const row=h("div","row"); const b1=h("button","btn","That is right"), b2=h("button","btn","That is wrong"); b1.type=b2.type="button";
    row.appendChild(b1); row.appendChild(b2); c.appendChild(row);
    const done=(saidRight)=>{ if(c.dataset.done) return; c.dataset.done=1; b1.disabled=b2.disabled=true; const ok=saidRight===it.ok;
      c.classList.add(ok?"right":"wrong"); answered++; if(ok) correct++;
      c.appendChild(h("div","res",(ok?"Correct. ":"Not quite. ")+"The claim is "+(it.ok?"true.":"false.")));
      c.appendChild(h("p","why",it.why));
      if(answered===items.length && onAll) onAll(correct, items.length); };
    b1.onclick=()=>done(true); b2.onclick=()=>done(false);
    grid.appendChild(c);
  });
}

/* ---- finite-automaton diagram (states in a row; her drawing conventions) ---- */
// M: {states:[], start, accept:[], edges:[{from,to,label}]}  -> handle {setState(s,cls), edge(from,to)}
function drawFA(box, M, opts){
  opts=opts||{}; box.innerHTML="";
  const s=svg("svg",{role:"img","aria-label":"State diagram"}); box.appendChild(s);
  const uid="m"+Math.random().toString(36).slice(2,8);

  const R0=28, n=M.states.length, GAP=n>4?150:(n>3?170:200);
  const pos={}; M.states.forEach((q,i)=>pos[q]={x:i*GAP,y:0});
  const groups=new Map();
  M.edges.forEach(e=>{ if(pos[e.from]===undefined||pos[e.to]===undefined) return; const k=e.from+"→"+e.to; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(e.label); });
  const bb={x0:-78,x1:(n-1)*GAP+44,y0:-44,y1:44}; const grow=(x,y)=>{bb.x0=Math.min(bb.x0,x);bb.x1=Math.max(bb.x1,x);bb.y0=Math.min(bb.y0,y);bb.y1=Math.max(bb.y1,y);};
  const eL=svg("g",{},s), lL=svg("g",{},s), sL=svg("g",{},s); const edges={}, labels={};
  for(const [k,ls] of groups){
    const [a,b]=k.split("→"); const A=pos[a], B=pos[b]; let d, lx, ly;
    const txt=ls.join(", ");
    if(a===b){ d=`M${A.x-13},${A.y-25} C${A.x-42},${A.y-92} ${A.x+42},${A.y-92} ${A.x+13},${A.y-25}`; lx=A.x; ly=A.y-82; }
    else{
      const ia=M.states.indexOf(a), ib=M.states.indexOf(b), fwd=ib>ia, span=Math.abs(ib-ia), rev=groups.has(b+"→"+a);
      const bend = fwd ? (span===1 ? (rev?-30:0) : -44-34*span) : (span===1 ? 30 : 44+34*span);
      const mx=(A.x+B.x)/2, cy=A.y+bend*2;
      const u=(px,py,qx,qy)=>{const dx=qx-px,dy=qy-py,L=Math.hypot(dx,dy)||1;return [dx/L,dy/L];};
      const [ux,uy]=u(A.x,A.y,mx,bend===0?A.y:cy), [vx,vy]=u(B.x,B.y,mx,bend===0?B.y:cy);
      const sx=A.x+ux*R0, sy=A.y+uy*R0, ex=B.x+vx*(R0+3), ey=B.y+vy*(R0+3);
      d = bend===0 ? `M${sx},${sy} L${ex},${ey}` : `M${sx},${sy} Q${mx},${cy} ${ex},${ey}`;
      lx=mx; ly = bend===0 ? A.y-10 : A.y+bend+(bend<0?-8:20);
    }
    edges[k]=svg("path",{d,class:"edge","marker-end":`url(#${uid}a)`},eL);
    const w=txt.length*8.3+12;
    const bg=svg("rect",{x:lx-w/2,y:ly-14,width:w,height:18,rx:5,class:"elabel-bg"},lL);
    const tx=svg("text",{x:lx,y:ly,"text-anchor":"middle",class:"elabel"},lL,txt);
    labels[k]={bg,tx}; grow(lx-w/2,ly-18); grow(lx+w/2,ly+8);
  }
  const S=pos[M.start];
  if(S){ svg("path",{d:`M${S.x-74},${S.y} L${S.x-R0-3},${S.y}`,class:"edge","marker-end":`url(#${uid}a)`},eL); svg("text",{x:S.x-74,y:S.y-8,class:"startlbl"},lL,"start"); }
  const sts={};
  M.states.forEach(q=>{ const P=pos[q]; const g=svg("g",{class:"st"},sL);
    svg("circle",{cx:P.x,cy:P.y,r:R0,class:"halo"},g); svg("circle",{cx:P.x,cy:P.y,r:R0,class:"st-circle"},g);
    if(M.accept.includes(q)) svg("circle",{cx:P.x,cy:P.y,r:R0-5,class:"st-ring"},g);
    const m=/^([^\d]+)(\d+)$/.exec(q); const tx=svg("text",{x:P.x,y:P.y+6,"text-anchor":"middle",class:"st-text"},g);
    if(q.length>4) tx.setAttribute("style","font-size:12px");
    if(m && q.length<=4){ svg("tspan",{},tx,m[1]); svg("tspan",{dy:"4","font-size":"12"},tx,m[2]); } else tx.textContent=q;
    sts[q]=g; });
  const pad=14, W=bb.x1-bb.x0+pad*2, H=bb.y1-bb.y0+pad*2;
  s.setAttribute("viewBox",`${bb.x0-pad} ${bb.y0-pad} ${W} ${H}`); s.setAttribute("width",W); s.style.maxHeight=(opts.maxH||260)+"px";
  const token=svg("circle",{r:7,class:"token",opacity:0},s);
  return {
    setState(q, cls){ Object.values(sts).forEach(g=>g.classList.remove("cur","done-acc","done-rej")); if(sts[q]) sts[q].classList.add(cls||"cur"); },
    edge(from,to,animate){ Object.entries(edges).forEach(([k,p])=>{ p.classList.remove("on"); p.setAttribute("marker-end",`url(#${uid}a)`); labels[k].tx.classList.remove("on"); labels[k].bg.classList.remove("on"); });
      const k=from+"→"+to, p=edges[k]; if(!p) return; p.classList.add("on"); p.setAttribute("marker-end",`url(#${uid}b)`); labels[k].tx.classList.add("on"); labels[k].bg.classList.add("on");
      if(animate && !reduceMotion){ const L=p.getTotalLength(), t0=performance.now(); token.setAttribute("opacity",1);
        (function f(now){ const kk=Math.min(1,(now-t0)/420); const pt=p.getPointAtLength(kk*L); token.setAttribute("cx",pt.x); token.setAttribute("cy",pt.y); if(kk<1) requestAnimationFrame(f); else token.setAttribute("opacity",0); })(t0); } },
    clearEdge(){ this.edge("",""); }
  };
}

/* ---- DFA utilities ---- */
// D: {states, sigma, start, accept, delta:{q:{a:q'}}}
function dfaEdges(D){ const out=[]; D.states.forEach(q=>D.sigma.forEach(a=>{ const t=D.delta[q] && D.delta[q][a]; if(t) out.push({from:q,to:t,label:a}); })); return out; }
function dfaRun(D, w){ const seq=[D.start]; let q=D.start; for(const c of w){ q = D.delta[q] ? D.delta[q][c] : undefined; if(q===undefined){ seq.push(null); break; } seq.push(q); } return seq; }
function dfaAccepts(D, w){ const seq=dfaRun(D,w); const last=seq[seq.length-1]; return last!==null && seq.length===[...w].length+1 && D.accept.includes(last); }
function allStrings(sigma, maxLen){ const out=[""]; let layer=[""]; for(let L=1;L<=maxLen;L++){ const nx=[]; layer.forEach(s=>sigma.forEach(a=>nx.push(s+a))); out.push(...nx); layer=nx; } return out; }
function dfaMinSize(D){ // reachable states, then partition refinement (Session 3)
  const reach=new Set([D.start]); const st=[D.start]; while(st.length){ const q=st.pop(); D.sigma.forEach(a=>{ const t=D.delta[q][a]; if(!reach.has(t)){ reach.add(t); st.push(t); } }); }
  const R=[...reach]; let part=new Map(); R.forEach(q=>part.set(q, D.accept.includes(q)?1:0));
  for(;;){ const sig=new Map(); const ids=new Map(); R.forEach(q=>{ const k=part.get(q)+"|"+D.sigma.map(a=>part.get(D.delta[q][a])).join(","); if(!ids.has(k)) ids.set(k,ids.size); sig.set(q,ids.get(k)); });
    const before=new Set(part.values()).size; part=sig; if(ids.size===before) return {min:ids.size, reachable:R.length}; }
}

/* ---- a runner: tape + diagram + state sequence, for any DFA ---- */
function faRunner(parent, D, opts){
  opts=opts||{}; const wrap=h("div","panel run"); parent.appendChild(wrap);
  const top=h("div","controls"); wrap.appendChild(top);
  const ib=h("div","inputbox"); const uid="in"+Math.random().toString(36).slice(2,7);
  ib.innerHTML=`<label for="${uid}">Input w</label><input id="${uid}" autocomplete="off" spellcheck="false" maxlength="14">`; top.appendChild(ib);
  const inp=ib.querySelector("input"); inp.value=opts.input||"";
  const exs=h("div","examples"); top.appendChild(exs);
  (opts.examples||[]).forEach(w=>{ const ok=dfaAccepts(D,w); const b=h("button","ex",`${esc(w||EPS)}<small class="${ok?"y":"n"}">${ok?"✓":"✗"}</small>`); b.type="button"; b.onclick=()=>{ inp.value=w; reset(); play(); }; exs.appendChild(b); });
  const tr=h("div","transport"); top.appendChild(tr);
  const mk=(lbl,path,cls)=>{ const b=h("button","ibtn"+(cls?" "+cls:""),`<svg viewBox="0 0 24 24" fill="currentColor"><path d="${path}"/></svg>`); b.type="button"; b.setAttribute("aria-label",lbl); b.title=lbl; tr.appendChild(b); return b; };
  const bR=mk("Back to the start","M6 5h2v14H6zM20 5v14L9 12z"), bB=mk("One symbol back","M18 5v14L7 12z"), bP=mk("Play","M7 4v16l13-8z","play"), bS=mk("Read one symbol","M6 5v14l11-7z");
  const tape=h("div","tape"); wrap.appendChild(tape);
  const dia=h("div","diagram"); wrap.appendChild(dia);
  const seqEl=h("div","seq"); wrap.appendChild(seqEl);
  const narr=h("div","narr"); narr.innerHTML=`<span class="step">start</span><p></p>`; wrap.appendChild(narr);
  const handle=drawFA(dia,{states:D.states,start:D.start,accept:D.accept,edges:dfaEdges(D)});
  let w="", seq=[], t=0, timer=null;
  function reset(){ stop(); w=inp.value.replace(/\s+/g,""); seq=dfaRun(D,w); t=0; render(false); }
  function render(anim){
    const chars=[...w]; tape.innerHTML="";
    chars.forEach((c,i)=>tape.appendChild(h("div","cell"+(i<t?" read":"")+(i===t?" head":""),esc(c))));
    tape.appendChild(h("div","cell end"+(t>=chars.length?" head":""),"end"));
    const last = t===seq.length-1; const q=seq[t]; const stuck = q===null;
    const acc = last && !stuck && seq.length===chars.length+1 && D.accept.includes(q);
    if(stuck){ handle.setState(seq[t-1],"done-rej"); handle.clearEdge(); }
    else { handle.setState(q, last ? (acc?"done-acc":"done-rej") : "cur"); if(t>0) handle.edge(seq[t-1],q,anim); else handle.clearEdge(); }
    seqEl.innerHTML=""; seq.slice(0,t+1).forEach((s,i)=>{ if(i>0) seqEl.appendChild(h("em",null,"—"+esc(chars[i-1])+"→")); seqEl.appendChild(h("span", i===t ? (last?(acc?"acc":"rej"):"cur") : "", s===null?"no arrow":esc(s))); });
    const st=narr.querySelector(".step"), p=narr.querySelector("p");
    if(t===0 && !last){ st.textContent="start"; p.innerHTML=`Start in <b>${esc(D.start)}</b>. Nothing has been read yet.`; }
    else if(stuck){ st.textContent="stuck"; p.innerHTML=`There is no arrow for <b>${esc(chars[t-1])}</b> out of ${esc(seq[t-1])}. A missing arrow does not mean reject: this is not a DFA yet.`; }
    else { st.textContent = t===0 ? "start" : "δ"; let txt = t===0 ? `The input is ε, so the machine never leaves <b>${esc(D.start)}</b>.` : `δ(${esc(seq[t-1])}, ${esc(chars[t-1])}) = <b>${esc(q)}</b>` + (D.facts && D.facts[q] ? `<span class="why">${esc(q)}: ${esc(D.facts[q])}</span>` : "");
      if(last) txt += `<span class="why" style="color:var(--ink);font-weight:600">Input exhausted in ${esc(q)}, which is ${acc?"":"not "}in F: ${acc?"ACCEPT":"REJECT"}. Only the last state matters.</span>`;
      p.innerHTML=txt; }
    bB.disabled=bR.disabled=t===0; bS.disabled=last;
    if(last && opts.onEnd) opts.onEnd(acc, w);
  }
  function step(){ if(t<seq.length-1){ t++; render(true); } }
  function play(){ if(timer) return; if(t>=seq.length-1){ t=0; render(false); } timer=setInterval(()=>{ step(); if(t>=seq.length-1) stop(); },850); }
  function stop(){ clearInterval(timer); timer=null; }
  bS.onclick=()=>{ stop(); step(); }; bB.onclick=()=>{ stop(); if(t>0){ t--; render(false); } }; bR.onclick=()=>{ stop(); t=0; render(false); }; bP.onclick=()=> timer?stop():play();
  inp.addEventListener("input",reset); inp.addEventListener("keydown",e=>{ if(e.key==="Enter"){ reset(); play(); } });
  Atlas.onCleanup(stop);
  reset();
  return {setInput(v){ inp.value=v; reset(); }, play, el:wrap};
}

        :`But look at the y's the adversary could choose: ${kinds.map(k=>"<b>"+esc(k.length>1?"a mix of "+k.split("").join(" and "):"all "+k+"'s")+"</b>").join(", ")}. You won the game, yet a written proof with this w needs ${kinds.length} cases. A w whose first p symbols are all the same letter leaves one.`}</p>`);

const sym = s => s===""?EPS:s;

const FIXED = {X:"--sym-X",Z:"--sym-Z",A:"--sym-A",B:"--sym-B",P:"--sym-P",N:"--sym-N"};
const SPARE = ["--sym-1","--sym-2","--sym-3","--sym-4","--sym-X","--sym-A","--sym-B"];
function symVar(s){ if(FIXED[s[0]] && s.length===1) return FIXED[s]; if(s[0]==="Z") return "--sym-Z"; let hsh=0; for(const c of s) hsh=(hsh*31+c.codePointAt(0))>>>0; return SPARE[hsh%SPARE.length]; }
const symColor = s => `var(${symVar(s)})`;


/* ---------- build a machine ---------- */
function buildMachine(def){
  const m = {...def};
  m.display = def.rules.map((r,i)=>({...r, idx:i, pushArr:tokenize(r.push)}));
  const gamma = new Set([def.bottom]);
  m.display.forEach(r=>{ if(r.pop!=="*") gamma.add(r.pop); r.pushArr.forEach(s=>{ if(s!=="*") gamma.add(s); }); });
  m.gamma=[...gamma].sort((a,b)=> (a===def.bottom)-(b===def.bottom) || a.localeCompare(b));
  const sigma=new Set(); m.display.forEach(r=>{ if(r.read) sigma.add(r.read); });
  m.sigma=[...sigma].sort();
  const states=[...(def.states||[])]; const addS=s=>{ if(s && !states.includes(s)) states.push(s); };
  addS(def.start); m.display.forEach(r=>{addS(r.from);addS(r.to);}); (def.accept||[]).forEach(addS);
  m.states=states;
  m.varName = m.gamma.includes("X") ? "□" : "X";
  m.concrete=[];
  m.display.forEach(r=>{
    const pops = r.pop==="*" ? m.gamma : [r.pop];
    pops.forEach(p=> m.concrete.push({from:r.from, read:r.read, pop:p, push:r.pushArr.map(s=>s==="*"?p:s), to:r.to, src:r.idx}));
  });
  m.det = checkDeterminism(m);
  return m;
}
function checkDeterminism(m){
  const issues=[]; const groups=new Map();
  m.concrete.forEach(r=>{ const k=r.from+"|"+r.read+"|"+r.pop; groups.set(k,(groups.get(k)||0)+1); });
  for(const [k,n] of groups){ if(n>1){ const [q,a,Z]=k.split("|"); issues.push(`Rule 1 fails: δ(${q}, ${sym(a)}, ${Z}) has ${n} choices`); } }
  const seen=new Set();
  m.concrete.forEach(r=>{ if(r.read!=="") return; const k=r.from+"|"+r.pop; if(seen.has(k)) return;
    if(m.concrete.some(o=>o.from===r.from && o.pop===r.pop && o.read!=="")){ seen.add(k); issues.push(`Rule 2 fails at (${r.from}, ${r.pop}): an ε-move and a reading move are both defined`); } });
  return issues;
}

/* ---------- explore every branch ---------- */
const LIM = {depth:60, stack:40, nodes:700};
function explore(m, input){
  const nodes=[]; const root={id:0,state:m.start,pos:0,stack:[m.bottom],depth:0,parent:null,rule:null,children:[]};
  nodes.push(root); const queue=[root]; let truncated=false;
  while(queue.length){
    const n=queue.shift();
    const consumed = n.pos===input.length;
    if(consumed && (m.mode==="final" ? m.accept.includes(n.state) : n.stack.length===0)){ n.status="accept"; continue; }
    if(n.stack.length===0){ n.status="stuck"; continue; }
    if(n.depth>=LIM.depth || nodes.length>=LIM.nodes){ n.status="cut"; truncated=true; continue; }
    const top=n.stack[0], next=input[n.pos];
    const moves=m.concrete.filter(r=>r.from===n.state && r.pop===top && (r.read==="" || r.read===next));
    if(!moves.length){ n.status="stuck"; continue; }
    n.status="inner";
    for(const r of moves){
      const st=r.push.concat(n.stack.slice(1));
      if(st.length>LIM.stack){ truncated=true; continue; }
      const c={id:nodes.length,state:r.to,pos:n.pos+(r.read?1:0),stack:st,depth:n.depth+1,parent:n,rule:r,children:[]};
      n.children.push(c); nodes.push(c); queue.push(c);
      if(nodes.length>=LIM.nodes){ truncated=true; break; }
    }
    if(!n.children.length){ n.status="cut"; }
  }
  // fate: does this subtree contain an accepting leaf?
  (function fate(n){ if(!n.children.length){ n.good = n.status==="accept"; return n.good; } let g=false; n.children.forEach(c=>{ if(fate(c)) g=true; }); n.good=g; return g; })(root);
  const leaves=nodes.filter(n=>!n.children.length);
  return {root,nodes,leaves,truncated,accepted:root.good,input};
}
function bestLeaf(n){
  let best=null;
  (function walk(x){ if(!x.children.length){
      const score = (x.status==="accept"?1e6:0) - (x.status==="accept"?x.depth:0) + (x.status!=="accept"? x.pos*1000 + x.depth : 0);
      if(!best || score>best.score) best={x,score}; return; }
    x.children.forEach(walk); })(n);
  return best.x;
}
function pathTo(leaf){ const p=[]; for(let x=leaf;x;x=x.parent) p.unshift(x); return p; }

/* ---------- state ---------- */
let M=null, R=null, path=[], t=0, playing=false, timer=null, current="anbn", lastStack=null, lastT=-1;

/* ---------- formatting ---------- */
function deltaText(r, varName){
  const pop = r.pop==="*" ? varName : r.pop;
  const push = r.pushArr ? (r.pushArr.length? r.pushArr.map(s=>s==="*"?varName:s).join("") : EPS) : str(r.push);
  return `δ(${r.from}, ${sym(r.read)}, ${pop}) = (${r.to}, ${push})`;
}
function concreteText(r){ return `δ(${r.from}, ${sym(r.read)}, ${r.pop}) = (${r.to}, ${str(r.push)})`; }
function edgeLabel(r, varName){
  const pop = r.pop==="*" ? varName : r.pop;
  const push = r.pushArr.length? r.pushArr.map(s=>s==="*"?varName:s).join("") : EPS;
  return `${sym(r.read)}, ${pop} → ${push}`;
}
function idText(n, wIn, wSt){
  const rest = R.input.slice(n.pos) || EPS;
  const st = str(n.stack);
  return `( ${n.state} , ${rest.padStart(wIn)} , ${st.padEnd(wSt)} )`;
}
function opWords(r){
  const top=r.pop, p=r.push;
  if(p.length===0) return `pop <b>${top}</b>`;
  if(p.length===1 && p[0]===top) return `leave the stack alone`;
  if(p[p.length-1]===top && p.length>1) return `push <b>${p.slice(0,-1).join("")}</b> on top of ${top}`;
  return `replace <b>${top}</b> by <b>${p.join("")}</b>`;
}

/* ---------- custom parser ---------- */
function buildCustom(){
  const errs=[]; const lines=$("src").value.split("\n");
  let start=null,bottom=null,accept=null,mode="final"; const rules=[];
  lines.forEach((raw,i)=>{
    const line=raw.replace(/#.*$/,"").trim(); if(!line) return;
    let mm;
    if((mm=/^(start|bottom|accept)\s*:\s*(.*)$/i.exec(line))){
      const k=mm[1].toLowerCase(), v=mm[2].trim();
      if(k==="start") start=v; else if(k==="bottom") bottom=v;
      else { if(/empty/i.test(v)){ mode="empty"; accept=[]; } else { mode="final"; accept=v.split(/[\s,{}]+/).filter(Boolean); } }
      return;
    }
    if((mm=/^(?:δ|d|delta)\s*\(\s*([^,]+?)\s*,\s*([^,]*?)\s*,\s*([^,)]+?)\s*\)\s*=\s*(.+)$/i.exec(line))){
      const from=mm[1], readRaw=mm[2], pop=mm[3]; const read=(readRaw===EPS||/^eps(ilon)?$/i.test(readRaw)||readRaw==="")?"":readRaw;
      if(read.length>1){ errs.push(`line ${i+1}: input symbols are single characters ("${readRaw}")`); return; }
      const re=/\(\s*([^,()]+?)\s*,\s*([^()]*?)\s*\)/g; let pm, any=false;
      while((pm=re.exec(mm[4]))){ any=true; rules.push({from,read,pop,push:tokenize(pm[2]).join(""),to:pm[1]}); }
      if(!any) errs.push(`line ${i+1}: could not read the right-hand side; write it as (q1, XZ)`);
      return;
    }
    errs.push(`line ${i+1}: not understood → ${line}`);
  });
  if(!rules.length) errs.push("No transitions yet. Add a line like δ(q0, a, Z) = (q0, XZ).");
  if(accept===null) errs.push('Add an "accept:" line, for example accept: q2 or accept: empty stack.');
  $("errs").textContent=errs.join("\n");
  if(errs.length) return false;
  const def={id:"custom",lang:"Your machine",idea:"Built from the transitions you wrote. Every branch is explored, up to "+LIM.depth+" moves.",
    states:[], start:start||rules[0].from, bottom:bottom||"Z", accept, mode, rules, examples:[], def:""};
  M=buildMachine(def);
  renderMachineCard();
  const ex=[]; const s=M.sigma; if(s.length){ ex.push(s[0]+s[0]+(s[1]||s[0])+(s[1]||s[0])); ex.push(s.join("")); }
  renderExamples(ex);
  if(!$("inp").value) $("inp").value=ex[0]||"";
  run(); return true;
}

    const c3=h_("span","chip", M.det[0]); chips.appendChild(c3); }

/* ---------- diagram ---------- */

    el("path",{d:"M0,0 L10,5 L0,10 z",style:`fill:${c}`},mk); });
  const R0=30, GAP=Math.max(230, 120+ (M.states.length>3?0:20)), LH=19;
  const pos={}; M.states.forEach((s,i)=>pos[s]={x:i*GAP,y:0});
  const groups=new Map();
  M.display.forEach(r=>{ const k=r.from+"→"+r.to; if(!groups.has(k)) groups.set(k,[]); groups.get(k).push(r); });
  const bb={x0:-80,x1:(M.states.length-1)*GAP+50,y0:-50,y1:50};
  const grow=(x,y)=>{bb.x0=Math.min(bb.x0,x);bb.x1=Math.max(bb.x1,x);bb.y0=Math.min(bb.y0,y);bb.y1=Math.max(bb.y1,y);};

    if(a===b){

      lx=A.x; ly=A.y-90;
    } else {
      const ia=M.states.indexOf(a), ib=M.states.indexOf(b); const fwd=ib>ia; const span=Math.abs(ib-ia);

      const mx=(A.x+B.x)/2, cy=A.y+bend*2; // quadratic control
      const u=(px,py,qx,qy)=>{const dx=qx-px,dy=qy-py,L=Math.hypot(dx,dy)||1;return [dx/L,dy/L];};
      const [ux,uy]=u(A.x,A.y,mx,bend===0?A.y:cy), [vx,vy]=u(B.x,B.y,mx,bend===0?B.y:cy);
      const sx=A.x+ux*R0, sy=A.y+uy*R0, ex=B.x+vx*(R0+3), ey=B.y+vy*(R0+3);

    geo.states[s]=g;

  svg.setAttribute("width",W); svg.style.maxHeight="300px";

/* ---------- run ---------- */
function run(){
  stop();
  const w=$("inp").value.replace(/\s+/g,"");
  R=explore(M,w);
  path=pathTo(bestLeaf(R.root)); t=0; lastStack=null; lastT=-1;
  renderTree(); render(false);
}
function follow(node){
  stop();
  path=pathTo(bestLeaf(node)); t=node.depth; lastStack=null; render(false);
}

/* ---------- render a moment ---------- */
function render(animate){
  const n=path[t]; const last=t===path.length-1; const leaf=path[path.length-1];
  $("counter").textContent=`move ${t}/${path.length-1}`;
  $("bBack").disabled=$("bReset").disabled=t===0; $("bStep").disabled=$("bEnd").disabled=last;
  // tape
  const tape=$("tape"); tape.innerHTML="";
  const chars=[...R.input];
  chars.forEach((c,i)=>{ const d=h_("div","cell"+(i<n.pos?" read":"")+(i===n.pos?" head":""),c); tape.appendChild(d); });
  const end=h_("div","cell end"+(n.pos===chars.length?" head":""),"end"); end.title="end of input"; tape.appendChild(end);
  // states + edges
  Object.entries(geo.states).forEach(([s,g])=>{ g.classList.remove("cur","done-acc","done-rej");
    if(s===n.state){ if(last && leaf.status==="accept") g.classList.add("done-acc"); else if(last && leaf.status!=="accept") g.classList.add("done-rej"); else g.classList.add("cur"); } });
  Object.values(geo.edges).forEach(p=>{p.classList.remove("on");p.setAttribute("marker-end","url(#arr)");});
  Object.values(geo.labels).forEach(l=>{l.tx.classList.remove("on");l.bg.classList.remove("on");});
  document.querySelectorAll("#mDelta li").forEach(li=>li.classList.remove("on"));
  if(n.rule){ const i=n.rule.src; const p=geo.edges[i]; p.classList.add("on"); p.setAttribute("marker-end","url(#arrOn)");
    geo.labels[i].tx.classList.add("on"); geo.labels[i].bg.classList.add("on");
    const li=document.querySelector(`#mDelta li[data-idx="${i}"]`); if(li) li.classList.add("on");
    if(animate && !reduceMotion) moveToken(p); }
  // narration
  narrate(n,last,leaf);
  // stamp
  const stamp=$("verdictStamp");
  if(last){ const acc=leaf.status==="accept"; stamp.hidden=false; if(t>0||path.length===1){ Atlas.stamp("pda","run"); if(acc && R.leaves.length>1) Atlas.stamp("pda","guess"); if(!acc) Atlas.stamp("pda","stuck"); } stamp.className="stamp "+(acc?"acc":"rej")+(animate?" pop":""); stamp.textContent = acc?"ACCEPT":(R.accepted?"STUCK":"REJECT"); }
  else stamp.hidden=true;
  renderStack(n.stack, animate);
  renderTrace();
  updateTree();
  renderSky();
  lastT=t;
}
function narrate(n,last,leaf){
  const step=$("nStep"), p=$("nText");
  if(!n.rule){ step.textContent="start";
    p.innerHTML=`Start in <b>${n.state}</b> with only the bottom marker <b>${M.bottom}</b> on the stack and all of <b>${R.input||EPS}</b> unread.<span class="why">${M.idea.split(".")[0]}.</span>`; }
  else { const r=n.rule; step.textContent="move "+t;
    const read = r.read ? `Read <b>${r.read}</b>` : `ε-move (read nothing)`;
    const stc = r.from===r.to ? `stay in ${r.from}` : `go ${r.from} → ${r.to}`;
    const note = M.display[r.src].note;
    p.innerHTML=`${read} with <b>${r.pop}</b> on top: ${opWords(r)}, ${stc}.<span class="why">${concreteText(r)}${note? " · "+note:""}</span>`; }
  if(last){
    let msg;
    if(leaf.status==="accept") msg = M.mode==="final" ? `Input exhausted and ${leaf.state} ∈ F, so ACCEPT.` : `Input exhausted and the stack is EMPTY, so ACCEPT.`;
    else if(leaf.status==="cut") msg = `This branch was cut off after ${LIM.depth} moves.`;
    else { const top=leaf.stack[0]; const nx=R.input[leaf.pos];
      msg = leaf.stack.length===0 ? `The stack is empty but input <b>${R.input.slice(leaf.pos)}</b> is left. No move is possible: stuck.` :
        (leaf.pos===R.input.length ? `Input exhausted, but no rule fires from (${leaf.state}, ε, ${top}) and this is not acceptance: stuck.` :
        `No transition for <b>${nx}</b> with <b>${top}</b> on top in ${leaf.state}: stuck. Stuck means reject, not error.`);
      msg += R.accepted ? ` <span class="why">Another branch accepts, and one success is enough. Click its green node below.</span>` :
        ` <span class="why">Every branch dies, so the machine rejects ${R.input||EPS}.</span>`; }
    p.innerHTML += `<span class="why" style="color:var(--ink);font-weight:600">${msg}</span>`;

}
function moveToken(path){
  const tok=geo.token; const L=path.getTotalLength(); const t0=performance.now(); const dur=Math.min(520, 520/speed());
  tok.setAttribute("opacity",1);
  (function f(now){ const k=Math.min(1,(now-t0)/dur); const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2; const pt=path.getPointAtLength(e*L);
    tok.setAttribute("cx",pt.x); tok.setAttribute("cy",pt.y); if(k<1) requestAnimationFrame(f); else tok.setAttribute("opacity",0); })(t0);
}

/* ---------- stack tower ---------- */
let plates=[]; // DOM nodes, index 0 = top
function renderStack(stack, animate){
  const tower=$("tower");
  const maxH=Math.max(...path.map(x=>x.stack.length),1);
  const avail=Math.max(tower.clientHeight-16, 240);
  const ph=Math.max(14, Math.min(34, Math.floor(avail/maxH)-4));
  tower.style.setProperty("--ph",ph+"px");
  if(!animate || !lastStack){
    tower.innerHTML=""; plates=[];
    for(let i=stack.length-1;i>=0;i--){ const d=makePlate(stack[i], i===stack.length-1); tower.appendChild(d); plates.unshift(d); }
  } else {
    // keep the common bottom part, animate the rest
    let k=0; while(k<lastStack.length && k<stack.length && lastStack[lastStack.length-1-k]===stack[stack.length-1-k]) k++;
    const removeN=lastStack.length-k, addN=stack.length-k;
    for(let i=0;i<removeN;i++){ const d=plates[i]; const top=d.offsetTop, left=d.offsetLeft, w=d.offsetWidth;
      d.style.top=top+"px"; d.style.left=left+"px"; d.style.width=w+"px"; d.classList.add("out"); setTimeout(()=>d.remove(),420); }
    plates=plates.slice(removeN);
    for(let i=addN-1;i>=0;i--){ const d=makePlate(stack[i], i===stack.length-1); d.classList.add("in"); d.style.animationDelay=((addN-1-i)*70)+"ms"; tower.appendChild(d); plates.unshift(d); }
  }
  lastStack=stack.slice();
  tower.querySelectorAll(".topmark,.tower-empty").forEach(x=>x.remove());
  if(!stack.length){ tower.appendChild(h_("div","tower-empty","empty stack")); }
  else { const mk=h_("div","topmark","top ▸"); tower.appendChild(mk);
    requestAnimationFrame(()=>{ const p=plates[0]; if(p) mk.style.top=(p.offsetTop+p.offsetHeight/2)+"px"; }); }
  const w=$("written"); w.innerHTML = stack.length ? `<i>${stack[0]}</i>${stack.slice(1).join("")}` : EPS;
}
function makePlate(s, isBottom){ const d=h_("div","plate"+(s===M.bottom && isBottom?" bottom":""),s); d.style.setProperty("--c",symColor(s)); d.style.background = (s===M.bottom && isBottom)? "" : symColor(s); return d; }

/* ---------- trace ---------- */
function renderTrace(){
  const box=$("trace"); box.innerHTML="";
  const wIn=Math.max(1,R.input.length), wSt=Math.max(...path.map(x=>Math.max(1,x.stack.length)));
  let curRow=null;
  path.forEach((n,i)=>{
    const row=h_("div","idr"+(i===t?" cur":"")+(i>t?" blank":""));
    row.appendChild(h_("span","tu",i===0?"":"⊢"));
    if(i<=t){ row.appendChild(h_("span",null,idText(n,wIn,wSt))); if(n.rule){ row.appendChild(h_("span","tu","")); row.appendChild(h_("span","why",concreteText(n.rule))); } }
    else row.appendChild(h_("span",null,`( ____ , ${"_".repeat(Math.max(4,wIn))} , ${"_".repeat(Math.max(4,wSt))} )`));
    box.appendChild(row); if(i===t) curRow=row;
  });
  if(t===path.length-1){ const leaf=path[t]; const acc=leaf.status==="accept";
    const v=h_("div","idr verdict "+(acc?"acc":"rej"));
    v.textContent = acc ? (M.mode==="final"?"Input exhausted, final state: ACCEPT":"Input exhausted, stack empty: ACCEPT")
      : (R.accepted ? "This branch is stuck. Another branch accepts." : "Stuck. Every branch dies: REJECT");
    box.appendChild(v); curRow=v; }
  if(curRow){ const top=curRow.offsetTop-box.offsetTop; if(top<box.scrollTop || top+curRow.offsetHeight>box.scrollTop+box.clientHeight) box.scrollTop=Math.max(0,top-box.clientHeight/2); }
}

/* ---------- multiverse tree ---------- */
let treeEls=null;
function renderTree(){
  const wrap=$("treeWrap"); wrap.innerHTML="";
  const COL=78, ROW=40, X0=30, Y0=26;
  let slot=0; const maxD=Math.max(...R.nodes.map(n=>n.depth));
  (function lay(n){ if(!n.children.length){ n.ty=Y0+slot*ROW; slot++; } else { n.children.forEach(lay); n.ty=(n.children[0].ty+n.children[n.children.length-1].ty)/2; } n.tx=X0+n.depth*COL; })(R.root);
  const W=X0+maxD*COL+90, H=Y0+Math.max(1,slot)*ROW;
  const svg=el("svg",{width:W,height:H,viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Tree of every branch"},wrap);
  const eg=el("g",{},svg), ng=el("g",{},svg);
  treeEls={nodes:new Map(),edges:new Map(),marks:new Map()};
  R.nodes.forEach(n=>{
    if(n.parent){ const p=n.parent; const mx=(p.tx+n.tx)/2;
      const e=el("path",{d:`M${p.tx},${p.ty} C${mx},${p.ty} ${mx},${n.ty} ${n.tx},${n.ty}`,class:"tedge"+(n.good?"":" fate-dead")},eg);
      treeEls.edges.set(n.id,e);
      if(n.rule && n.rule.read==="" ){ const lb=el("text",{x:mx,y:(p.ty+n.ty)/2-4,"text-anchor":"middle",class:"tlabel"},eg,"ε"); treeEls.edges.set(n.id+"_l",lb); }
    }
    const g=el("g",{class:"tnode",tabindex:"0",role:"button"},ng);
    el("title",{},g,`(${n.state}, ${R.input.slice(n.pos)||EPS}, ${str(n.stack)})`);
    el("circle",{cx:n.tx,cy:n.ty,r:14},g);
    el("text",{x:n.tx,y:n.ty+4,"text-anchor":"middle"},g,n.state);
    g.addEventListener("click",()=>follow(n));
    g.addEventListener("keydown",e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); follow(n);} });
    treeEls.nodes.set(n.id,g);
    if(!n.children.length){
      const lbl = n.status==="accept" ? "✓ accept" : n.status==="cut" ? "… cut" : "✗ stuck";
      const tm=el("text",{x:n.tx+20,y:n.ty+4,class:"tmark "+(n.status==="accept"?"acc":"rej")},ng,lbl);
      treeEls.marks.set(n.id,tm);
    }
  });
}
function updateTree(){
  if(!treeEls) return;
  const last=t===path.length-1; const reveal = last ? Infinity : t;
  const onPath=new Set(path.slice(0,t+1).map(n=>n.id));
  R.nodes.forEach(n=>{
    const g=treeEls.nodes.get(n.id); const vis=n.depth<=reveal;
    g.setAttribute("class","tnode"+(vis?"":" hide")+(onPath.has(n.id)?" path":"")+(n.id===path[t].id?" cur":"")+
      (!n.children.length && vis && n.status==="accept"?" acc":"")+(!n.children.length && vis && n.status!=="accept"?" dead":""));
    const e=treeEls.edges.get(n.id); if(e){ e.setAttribute("class","tedge"+(n.good?"":" fate-dead")+(vis?"":" hide")+(onPath.has(n.id)?" path":"")); }
    const lb=treeEls.edges.get(n.id+"_l"); if(lb) lb.style.opacity=vis?1:0;
    const mk=treeEls.marks.get(n.id); if(mk) mk.style.opacity=vis?1:0;
  });
  const alive=R.nodes.filter(n=>n.depth===t).length;
  const leaves=R.leaves; const acc=leaves.filter(n=>n.status==="accept").length;
  const stats=$("mvstats"); stats.innerHTML="";
  const add=(k,v)=>{ const s=h_("span"); s.innerHTML=`${k} <b>${v}</b>`; stats.appendChild(s); };
  add("Branches alive at this move:", alive);
  add("Branches in total:", leaves.length);
  if(last){ add("Accepting:", acc); add("Verdict:", R.accepted?"ACCEPT (one success is enough)":"REJECT (every branch failed)"); }
  if(R.truncated) add("Note:", "tree cut off at "+LIM.depth+" moves");
  // keep current node in view
  const g=treeEls.nodes.get(path[t].id); const wrap=$("treeWrap");
  if(g){ const c=g.querySelector("circle"); const x=+c.getAttribute("cx"), y=+c.getAttribute("cy");
    if(x<wrap.scrollLeft+20 || x>wrap.scrollLeft+wrap.clientWidth-60) wrap.scrollLeft=Math.max(0,x-wrap.clientWidth/2);
    if(y<wrap.scrollTop+10 || y>wrap.scrollTop+wrap.clientHeight-10) wrap.scrollTop=Math.max(0,y-wrap.clientHeight/2); }
}

/* ---------- stack skyline ---------- */
function renderSky(){
  const wrap=$("skyWrap"); wrap.innerHTML="";
  const CW=32, GAP=7, BH=20, X0=30, TOPP=12, AX=36;
  const maxH=Math.max(...path.map(n=>n.stack.length),1);
  const W=X0+path.length*(CW+GAP)+10, H=TOPP+maxH*BH+AX;
  const svg=el("svg",{width:W,height:H,viewBox:`0 0 ${W} ${H}`,role:"img","aria-label":"Stack contents at every move"},wrap);
  const base=TOPP+maxH*BH;
  for(let k=0;k<=maxH;k+=Math.max(1,Math.ceil(maxH/5))){ el("text",{x:X0-8,y:base-k*BH+3,"text-anchor":"end",class:"sky-axis"},svg,String(k)); }
  el("line",{x1:X0-2,x2:W-6,y1:base+0.5,y2:base+0.5,style:"stroke:var(--line)"},svg);
  path.forEach((n,i)=>{
    const x=X0+i*(CW+GAP); const g=el("g",{class:"sky-col"+(i>t?" future":"")},svg);
    const st=n.stack;
    for(let j=0;j<st.length;j++){ const s=st[st.length-1-j]; el("rect",{x,y:base-(j+1)*BH,width:CW,height:BH,rx:3,class:"sky-block",style:`fill:${symColor(s)}`},g); }
    if(!st.length) el("text",{x:x+CW/2,y:base-4,"text-anchor":"middle",class:"sky-axis"},g,"∅");
    const lab = i===0 ? "" : sym(n.rule.read);
    el("text",{x:x+CW/2,y:base+14,"text-anchor":"middle",class:"sky-axis",style:n.rule&&!n.rule.read?"fill:var(--now)":""},g,lab);
    el("text",{x:x+CW/2,y:base+27,"text-anchor":"middle",class:"sky-axis",style:"font-size:8.5px"},g,String(i));
    if(i===t) el("rect",{x:x-3,y:Math.min(base-st.length*BH, base-BH)-4,width:CW+6,height:Math.max(st.length,1)*BH+8,class:"sky-cur"},svg);
  });
  const cx=X0+t*(CW+GAP); if(cx>wrap.clientWidth-40) wrap.scrollLeft=cx-wrap.clientWidth/2;
  const lg=$("legend"); lg.innerHTML="";
  M.gamma.forEach(s=>{ const sp=h_("span"); sp.innerHTML=`<i style="background:${symColor(s)}"></i>${s}${s===M.bottom?" (bottom marker)":""}`; lg.appendChild(sp); });
  const sp=h_("span"); sp.textContent="Row under the columns: the symbol read at that move (ε = read nothing)"; lg.appendChild(sp);
}

/* ---------- playback ---------- */
const speed = () => parseFloat($("speed").value)||1;
function step(){ if(t<path.length-1){ t++; render(true); } else stop(); }
function back(){ if(t>0){ t--; render(true); } }
function start(){ if(playing) return; if(t>=path.length-1){ t=0; lastStack=null; render(false); } playing=true; setPlayIcon(); tick(); }
function tick(){ timer=setTimeout(()=>{ if(!playing) return; step(); if(t>=path.length-1){ stop(); return; } tick(); }, 1150/speed()); }
function stop(){ playing=false; clearTimeout(timer); setPlayIcon(); }
function setPlayIcon(){ const b=$("bPlay"); b.setAttribute("aria-label",playing?"Pause":"Play"); $("playIcon").innerHTML = playing ? '<path d="M6 4h4v16H6zM14 4h4v16h-4z"/>' : '<path d="M7 4v16l13-8z"/>'; }

$("bPlay").onclick=()=> playing?stop():start();
$("bStep").onclick=()=>{ stop(); step(); };
$("bBack").onclick=()=>{ stop(); back(); };
$("bReset").onclick=()=>{ stop(); t=0; lastStack=null; render(false); };
$("bEnd").onclick=()=>{ stop(); t=path.length-1; render(true); };
$("inp").addEventListener("input",()=>{ clearTimeout(window.__inpT); window.__inpT=setTimeout(run,250); });
$("inp").addEventListener("keydown",e=>{ if(e.key==="Enter"){ run(); start(); } });
$("buildBtn").onclick=()=>{ if(buildCustom()){ start(); Atlas.stamp("pda","own"); } };
$("loadBtn").onclick=()=>{ $("src").value=CUSTOM_SRC; buildCustom(); };
const onKey=e=>{ if(!document.getElementById("tower")) return;
  if(/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if(e.key===" "){ e.preventDefault(); playing?stop():start(); }
  else if(e.key==="ArrowRight"){ stop(); step(); }
  else if(e.key==="ArrowLeft"){ stop(); back(); }
  else if(e.key==="Home"){ stop(); t=0; lastStack=null; render(false); }
  else if(e.key==="End"){ stop(); t=path.length-1; render(true); }
}; document.addEventListener("keydown",onKey);
$("fsBtn").onclick=()=>{
  const root=document.documentElement;
  if(document.fullscreenElement){ document.exitFullscreen&&document.exitFullscreen(); return; }
  root.classList.add("present");
  const p = root.requestFullscreen ? root.requestFullscreen() : null;
  if(p && p.catch) p.catch(()=>{});
};
document.addEventListener("fullscreenchange",()=>{ if(!document.fullscreenElement) document.documentElement.classList.remove("present"); });

let rT; const onRz=()=>{ clearTimeout(rT); rT=setTimeout(()=>{ if(document.getElementById("tower")){ lastStack=null; render(false); } },150); }; window.addEventListener("resize",onRz);

// expose for tests / GIF export
window.PDA={PRESETS,buildMachine,explore,bestLeaf,pathTo,select:id=>selectMachine(id,false),setInput:w=>{ $("inp").value=w; run(); },
  goto:k=>{ stop(); t=Math.max(0,Math.min(path.length-1,k)); render(true); }, len:()=>path.length, state:()=>({t,path,R})};

selectMachine("anbn", false);
if(!reduceMotion && !window.__noAutoplay) setTimeout(()=>{ if(document.getElementById("tower")) start(); }, 900);
Atlas.onCleanup(()=>{ stop(); document.removeEventListener("keydown",onKey); window.removeEventListener("resize",onRz); document.documentElement.classList.remove("present"); });
};
document.getElementById("logoBtn").onclick=()=>Atlas.go("home");
window.addEventListener("hashchange",()=>Atlas.route());
Atlas.route();
</script>
